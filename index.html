
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101322">
<title>AI Tool Maker Pro 9</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#0b1020;
 color:#f8fafc;
 font-family:Arial,sans-serif;
 min-height:100vh;
 padding:20px;
}
.container{
 max-width:850px;
 margin:35px auto;
}
.header{text-align:center;margin-bottom:30px}
.header h1{font-size:30px;margin:0 0 10px}
.header p{color:#94a3b8}
.panel{
 background:#151d32;
 border:1px solid #293650;
 border-radius:18px;
 padding:22px;
 margin-bottom:20px;
}
label{display:block;margin-bottom:12px;font-weight:bold}
textarea{
 width:100%;
 min-height:150px;
 resize:vertical;
 background:#0b1020;
 color:white;
 border:1px solid #35445f;
 border-radius:12px;
 padding:16px;
 font-size:16px;
 outline:none;
 line-height:1.7;
}
textarea:focus{border-color:#38bdf8}
button{
 border:0;
 border-radius:10px;
 padding:14px 22px;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}
.ask-btn{
 width:100%;
 margin-top:15px;
 background:#0ea5e9;
 color:white;
}
.ask-btn:disabled{opacity:.5;cursor:not-allowed}
.new-btn{
 background:#334155;
 color:white;
 margin-top:10px;
}
.status{
 margin-top:16px;
 color:#94a3b8;
 line-height:1.7;
 white-space:pre-wrap;
}
.result{display:none}
.link-box{
 background:#0b1020;
 border:1px solid #334155;
 padding:13px;
 border-radius:10px;
 overflow-wrap:anywhere;
 direction:ltr;
 text-align:left;
 margin:12px 0;
}
.link-box a{color:#38bdf8}
.actions{
 display:flex;
 flex-wrap:wrap;
 gap:10px;
 margin-top:12px;
}
.actions button{background:#334155;color:white}
.preview{
 width:100%;
 height:500px;
 border:1px solid #334155;
 border-radius:12px;
 background:white;
 margin-top:15px;
}
.small{font-size:13px;color:#94a3b8}
</style>
</head>

<body>
<div class="container">

 <div class="header">
  <h1>AI Tool Maker Pro 9</h1>
  <p>اپنی ضرورت لکھیں، حقیقی AI آپ کا ٹول بنائے گا</p>
 </div>

 <div class="panel">
  <label for="prompt">آپ کون سا ٹول بنانا چاہتے ہیں؟</label>

  <textarea id="prompt"
   placeholder="مثال: میرے لیے ایک پروفیشنل ویڈیو ایڈیٹنگ ٹول بناؤ جس میں ویڈیو اپلوڈ، کٹ، ٹیکسٹ اور ڈاؤن لوڈ کے آپشن ہوں۔"></textarea>

  <button class="ask-btn" id="askBtn" onclick="askAI()">
   ASK — ٹول بنائیں
  </button>

  <div class="status" id="status">
   تیار ہے۔ اپنا حکم لکھیں اور ASK دبائیں۔
  </div>

  <button class="new-btn" onclick="newProject()">
   نیا ٹول شروع کریں
  </button>

  <p class="small">
   اگلی بار اسی ٹول میں تبدیلی کے لیے اپنا نیا حکم لکھ کر ASK دبائیں۔
  </p>
 </div>

 <div class="panel result" id="result">
  <h3 id="resultTitle">آپ کا ٹول تیار ہے</h3>

  <p>آپ کے ٹول کا مستقل لنک:</p>
  <div class="link-box">
   <a id="toolLink" href="#" target="_blank"></a>
  </div>

  <div class="actions">
   <button onclick="copyLink()">لنک کاپی کریں</button>
   <button onclick="openTool()">ٹول کھولیں</button>
   <button onclick="downloadHTML()">HTML ڈاؤن لوڈ کریں</button>
  </div>

  <h3>ٹول کا پری ویو</h3>
  <iframe class="preview" id="preview"
   sandbox="allow-scripts allow-forms allow-modals allow-downloads">
  </iframe>

  <p class="small" id="versionInfo"></p>
 </div>

</div>

<script>
const API_URL = "https://ai-tool-maker-backed.naveedahmad568344.workers.dev";

const STORAGE_KEY = "aitoolmaker_pro9_current_tool";

let currentToolId = localStorage.getItem(STORAGE_KEY) || "";
let currentHTML = "";
let currentURL = "";

const promptBox = document.getElementById("prompt");
const askBtn = document.getElementById("askBtn");
const statusBox = document.getElementById("status");

async function askAI(){

 const prompt = promptBox.value.trim();

 if(!prompt){
  statusBox.textContent = "براہ کرم پہلے اپنا حکم لکھیں۔";
  return;
 }

 askBtn.disabled = true;
 askBtn.textContent = "AI کام کر رہا ہے...";
 statusBox.textContent = "Cloudflare AI سے رابطہ ہو رہا ہے۔ براہ کرم انتظار کریں۔";

 try{

  const response = await fetch(API_URL + "/api/create", {
   method:"POST",
   headers:{
    "Content-Type":"application/json"
   },
   body:JSON.stringify({
    prompt:prompt,
    toolName:"AI Tool Maker Pro 9",
    language:"HTML, CSS and JavaScript",
    toolId:currentToolId || null
   })
  });

  const data = await response.json();

  if(!response.ok || !data.success){
   throw new Error(data.error || data.message || "AI سے جواب موصول نہیں ہوا۔");
  }

  if(!data.id && !data.toolId){
   throw new Error("سرور نے ٹول کی شناخت فراہم نہیں کی۔");
  }

  currentToolId = data.toolId || data.id;
  localStorage.setItem(STORAGE_KEY,currentToolId);

  currentHTML = data.html || "";
  currentURL = data.publicUrl || (API_URL + "/tools/" + currentToolId);

  document.getElementById("result").style.display = "block";
  document.getElementById("toolLink").href = currentURL;
  document.getElementById("toolLink").textContent = currentURL;

  document.getElementById("resultTitle").textContent =
   data.updated ? "آپ کا موجودہ ٹول اپڈیٹ ہوگیا!" : "آپ کا نیا ٹول تیار ہے!";

  document.getElementById("versionInfo").textContent =
   "ورژن: " + (data.version || "1") +
   (data.previousVersionSaved ? " — پچھلا ورژن بھی محفوظ ہے۔" : "");

  if(currentHTML){
   document.getElementById("preview").srcdoc = currentHTML;
  }else{
   document.getElementById("preview").src = currentURL;
  }

  statusBox.textContent = data.message ||
   "کامیابی! آپ کا ٹول Cloudflare R2 میں محفوظ ہوگیا۔";

  promptBox.value = "";

 }catch(error){

  statusBox.textContent =
   "مسئلہ: " + error.message +
   "\n\nبراہ کرم Worker کی deployment اور AI اور R2 bindings چیک کریں۔";

 }finally{

  askBtn.disabled = false;
  askBtn.textContent = "ASK — ٹول بنائیں";

 }
}

function copyLink(){
 if(!currentURL)return;
 navigator.clipboard.writeText(currentURL)
  .then(()=>statusBox.textContent="لنک کاپی ہوگیا۔")
  .catch(()=>statusBox.textContent="لنک کاپی نہیں ہوسکا۔");
}

function openTool(){
 if(currentURL)window.open(currentURL,"_blank");
}

function downloadHTML(){
 if(!currentHTML){
  statusBox.textContent="HTML ابھی دستیاب نہیں ہے۔";
  return;
 }

 const blob = new Blob([currentHTML],{type:"text/html"});
 const url = URL.createObjectURL(blob);
 const a = document.createElement("a");

 a.href = url;
 a.download = "my-ai-tool.html";
 a.click();

 URL.revokeObjectURL(url);
}

function newProject(){
 if(!confirm("کیا آپ نیا ٹول شروع کرنا چاہتے ہیں؟ موجودہ ٹول Cloudflare میں محفوظ رہے گا۔")){
  return;
 }

 currentToolId = "";
 currentHTML = "";
 currentURL = "";

 localStorage.removeItem(STORAGE_KEY);

 promptBox.value = "";
 document.getElementById("result").style.display = "none";
 document.getElementById("preview").srcdoc = "";

 statusBox.textContent = "نیا ٹول بنانے کے لیے اپنا حکم لکھیں۔";
}

</script>
</body>
</html>
