<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101322">
<meta name="description" content="AI Tool Maker Pro 9 — حقیقی AI سے اپنے ویب ٹول بنائیں۔">
<title>AI Tool Maker Pro 9</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;background:#0b1020;color:#f8fafc;font-family:Arial,sans-serif;min-height:100vh;padding:16px}
.container{max-width:900px;margin:24px auto}
.header{text-align:center;margin:10px 0 26px}
.header h1{font-size:clamp(25px,5vw,36px);margin:0 0 10px}
.header p{color:#a8b4c8;line-height:1.8;margin:0}
.panel{background:#151d32;border:1px solid #293650;border-radius:18px;padding:clamp(16px,4vw,24px);margin-bottom:18px;box-shadow:0 12px 35px #0002}
label{display:block;margin-bottom:12px;font-weight:bold}
textarea,select{width:100%;background:#0b1020;color:white;border:1px solid #35445f;border-radius:12px;padding:15px;font-size:16px;outline:none;line-height:1.8}
textarea{min-height:155px;resize:vertical}
textarea:focus,select:focus{border-color:#38bdf8}
button{border:0;border-radius:11px;padding:13px 18px;font-size:15px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.ask-btn{width:100%;margin-top:14px;background:#0ea5e9;color:white}
.secondary,.actions button,.examples button{background:#334155;color:white}
.status{margin-top:15px;color:#cbd5e1;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
.result{display:none}
.link-box{background:#0b1020;border:1px solid #334155;padding:13px;border-radius:10px;overflow-wrap:anywhere;direction:ltr;text-align:left;margin:12px 0}
.link-box a{color:#38bdf8}
.actions,.examples{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
.preview{width:100%;height:520px;border:1px solid #334155;border-radius:12px;background:white;margin-top:12px}
.small{font-size:13px;color:#94a3b8;line-height:1.8}
.topline{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:18px;color:#86efac;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block}
.examples button{font-size:13px;padding:9px 12px;background:#26334d;color:#dbeafe}
h3{margin-top:0}
@media(max-width:520px){body{padding:10px}.container{margin:12px auto}.actions button{flex:1}.preview{height:430px}}
</style>
</head>
<body>
<div class="container">
<header class="header">
<h1>🤖 AI Tool Maker Pro 9</h1>
<p>اپنی ضرورت لکھیں، حقیقی AI آپ کے لیے ویب ٹول تیار کرے گا</p>
</header>

<section class="panel">
<div class="topline"><span class="dot"></span><span>AI Builder تیار ہے</span></div>
<label for="prompt">آپ کون سا ٹول بنانا چاہتے ہیں؟</label>
<textarea id="prompt" placeholder="مثال: میرے لیے ایک پروفیشنل ویڈیو ایڈیٹنگ ٹول بناؤ جس میں ویڈیو اپلوڈ، کٹ، ٹیکسٹ اور ڈاؤن لوڈ کے آپشن ہوں۔"></textarea>
<div class="examples">
<button type="button" onclick="useExample('ایک خوبصورت کیلکولیٹر بناؤ جس میں جمع، تفریق، ضرب اور تقسیم ہو۔')">🧮 کیلکولیٹر</button>
<button type="button" onclick="useExample('اردو اور انگریزی مضمون لکھنے اور کاپی کرنے کا ٹول بناؤ۔')">✍️ رائٹر</button>
<button type="button" onclick="useExample('ایک نوٹس میکر بناؤ جس میں نوٹس محفوظ اور حذف کیے جا سکیں۔')">📝 نوٹس</button>
<button type="button" onclick="useExample('ایک ویڈیو کریئیٹر ٹول بناؤ جس میں ویڈیو اپلوڈ، ٹیکسٹ شامل کرنے اور ڈاؤن لوڈ کرنے کے آپشن ہوں۔')">🎬 ویڈیو کریئیٹر</button>
</div>
<label for="language" style="margin-top:16px">جواب کی زبان</label>
<select id="language">
<option value="Urdu">اردو</option>
<option value="English">English</option>
<option value="Roman Urdu">Roman Urdu</option>
</select>
<button class="ask-btn" id="askBtn" type="button" onclick="askAI()">ASK — میرا ٹول بنائیں</button>
<div class="status" id="status" role="status" aria-live="polite">تیار ہے۔ اپنا حکم لکھیں اور ASK دبائیں۔</div>
<button class="secondary" type="button" onclick="newProject()">نیا ٹول شروع کریں</button>
<p class="small">اسی ٹول میں تبدیلی کے لیے اپنا نیا حکم لکھیں۔ موجودہ ٹول کی شناخت محفوظ رہے گی۔</p>
</section>

<section class="panel result" id="result">
<h3 id="resultTitle">آپ کا ٹول تیار ہے</h3>
<p>آپ کے ٹول کا پبلک لنک:</p>
<div class="link-box"><a id="toolLink" href="#" target="_blank" rel="noopener"></a></div>
<div class="actions">
<button type="button" onclick="copyLink()">لنک کاپی کریں</button>
<button type="button" onclick="openTool()">ٹول کھولیں</button>
<button type="button" onclick="downloadHTML()">HTML ڈاؤن لوڈ</button>
</div>
<h3 style="margin-top:22px">ٹول کا پری ویو</h3>
<iframe class="preview" id="preview" title="آپ کے ٹول کا پری ویو" sandbox="allow-scripts allow-forms allow-modals allow-downloads"></iframe>
<p class="small" id="versionInfo"></p>
</section>
</div>

<script>
"use strict";
// آپ کا اصل Cloudflare Worker URL پہلے سے شامل ہے:
const API_URL = "https://ai-tool-maker-backed.naveedahmad568344.workers.dev";
const STORAGE_KEY = "aitoolmaker_pro9_current_tool";
let currentToolId = localStorage.getItem(STORAGE_KEY) || "";
let currentHTML = "";
let currentURL = "";

const promptBox = document.getElementById("prompt");
const askBtn = document.getElementById("askBtn");
const statusBox = document.getElementById("status");

function useExample(text){promptBox.value=text;promptBox.focus();}

async function askAI(){
  const prompt=promptBox.value.trim();
  if(!prompt){statusBox.textContent="براہ کرم پہلے اپنا حکم لکھیں۔";promptBox.focus();return;}
  askBtn.disabled=true;
  askBtn.textContent="AI کام کر رہا ہے...";
  statusBox.textContent="Cloudflare Worker اور Hugging Face AI سے رابطہ ہو رہا ہے۔ براہ کرم انتظار کریں۔";
  try{
    const response=await fetch(API_URL+"/api/create",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        prompt,
        toolName:"AI Tool Maker Pro 9",
        language:document.getElementById("language").value,
        toolId:currentToolId||null
      })
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok||!data.success)throw new Error(data.error||data.message||"AI سے جواب موصول نہیں ہوا۔");
    if(!data.toolId&&!data.id)throw new Error("سرور نے ٹول کی شناخت فراہم نہیں کی۔");

    currentToolId=data.toolId||data.id;
    localStorage.setItem(STORAGE_KEY,currentToolId);
    currentHTML=data.html||"";
    currentURL=data.publicUrl||(API_URL+"/tools/"+currentToolId);

    document.getElementById("result").style.display="block";
    const link=document.getElementById("toolLink");
    link.href=currentURL;
    link.textContent=currentURL;
    document.getElementById("resultTitle").textContent=data.updated?"آپ کا موجودہ ٹول اپڈیٹ ہوگیا!":"آپ کا نیا ٹول تیار ہے!";
    document.getElementById("versionInfo").textContent="ورژن: "+(data.version||"1")+" — ٹول Cloudflare R2 میں محفوظ ہے۔";
    if(currentHTML)document.getElementById("preview").srcdoc=currentHTML;
    else document.getElementById("preview").src=currentURL;
    statusBox.textContent=data.message||"کامیابی! آپ کا ٹول محفوظ ہوگیا۔";
    promptBox.value="";
    document.getElementById("result").scrollIntoView({behavior:"smooth",block:"start"});
  }catch(error){
    statusBox.textContent="مسئلہ: "+error.message+"\n\nچیک کریں کہ Worker deploy ہے، HF_TOKEN Secret موجود ہے اور R2 binding کا نام TOOL_BUCKET ہے۔";
  }finally{
    askBtn.disabled=false;
    askBtn.textContent="ASK — میرا ٹول بنائیں";
  }
}

async function copyLink(){
  if(!currentURL)return;
  try{await navigator.clipboard.writeText(currentURL);statusBox.textContent="لنک کاپی ہوگیا۔";}
  catch(e){statusBox.textContent="لنک کاپی نہیں ہوسکا۔ لنک پر دیر تک دباکر کاپی کریں۔";}
}
function openTool(){if(currentURL)window.open(currentURL,"_blank","noopener");}
function downloadHTML(){
  if(!currentHTML){statusBox.textContent="HTML ابھی دستیاب نہیں ہے۔";return;}
  const blob=new Blob([currentHTML],{type:"text/html;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="my-ai-tool.html";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function newProject(){
  if(!confirm("کیا آپ نیا ٹول شروع کرنا چاہتے ہیں؟ محفوظ شدہ ٹول کا لنک برقرار رہے گا۔"))return;
  currentToolId="";currentHTML="";currentURL="";
  localStorage.removeItem(STORAGE_KEY);
  promptBox.value="";
  document.getElementById("result").style.display="none";
  document.getElementById("preview").removeAttribute("src");
  document.getElementById("preview").srcdoc="";
  statusBox.textContent="نیا ٹول بنانے کے لیے اپنا حکم لکھیں۔";
}
</script>
</body>
</html>
